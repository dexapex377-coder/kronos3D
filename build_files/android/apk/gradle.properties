# Project-wide Gradle settings.
#
# The daemon heap is the one setting that actually decides whether this build
# works. With the default 512 MiB, :app:mergeExtDexRelease -- which merges the dex
# of every Compose/material3 AAR plus our own -- sat in GC thrash for 40 minutes
# without finishing. 4 GiB finishes it in about one.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Single module, so parallel execution buys nothing and costs peak heap. Two
# workers is also what the runner has cores for.
org.gradle.parallel=false
org.gradle.workers.max=2

# The build reads the 148 staged .so files through the VFS; watching for changes
# buys nothing in CI, where nothing changes under it.
org.gradle.vfs.watch=false

org.gradle.caching=true

# AGP 9 warns about, and will eventually fail on, useLegacyPackaging being the
# non-default. It is still the only way to get libblender.so extracted rather than
# mapped straight out of the APK: it is 158 MB and the loader has to be able to
# find it by path, so it has to land as a real file in nativeLibraryDir. The
# AndroidManifest no longer carries android:extractNativeLibs for the same reason;
# this is the supported way to say it.
android.useAndroidX=true
android.nonTransitiveRClass=true