rootProject.name = 'Kronos3D'
include ':app'

// Plugin markers, not plain jars: `plugins { id 'org.jetbrains.kotlin.plugin.compose' }`
// resolves through these repositories by marker artifact, and never through the
// buildscript classpath, so a classpath entry alone fails with "was not found in any
// of the following sources". gradlePluginPortal carries the Kotlin markers,
// google() the Android ones.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}